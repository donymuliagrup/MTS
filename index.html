<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web Application</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            -webkit-text-size-adjust: 100%;
        }
        #gasFrame {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            border: none;
            display: block;
            background: #eef2f7;
        }
    </style>
</head>
<body>

    <iframe 
        id="gasFrame"
        src="https://script.google.com/macros/s/AKfycbz6ll2nnIKoe-5R50rs1thq2TTqqni-jM3ZaSIfj5RkqCICTLJ8Zt9gjVIlGDPuGjG48A/exec" 
        allow="geolocation; camera; microphone">
    </iframe>

    <script>
        // Tangani sinyal resize dari dalam iframe GAS
        window.addEventListener('message', function(e){
            try {
                if(!e.data || e.data.type !== 'gas-resize') return;
                var f = document.getElementById('gasFrame');
                if(!f) return;
                // Toggle transform pada iframe (memaksa iOS recalc touch regions)
                f.style.transform = 'translateZ(0)';
                void f.offsetHeight;
                requestAnimationFrame(function(){
                    try { f.style.transform = ''; } catch(err){}
                });
                // Dispatch resize di parent
                try { window.dispatchEvent(new Event('resize')); } catch(err){}
            } catch(err){}
        });

        // Recalc saat orientasi berubah
        window.addEventListener('orientationchange', function(){
            setTimeout(function(){ try { window.dispatchEvent(new Event('resize')); } catch(e){} }, 100);
            setTimeout(function(){ try { window.dispatchEvent(new Event('resize')); } catch(e){} }, 400);
            setTimeout(function(){ try { window.dispatchEvent(new Event('resize')); } catch(e){} }, 800);
        });

        // Recalc awal saat load
        setTimeout(function(){ try { window.dispatchEvent(new Event('resize')); } catch(e){} }, 300);
        setTimeout(function(){ try { window.dispatchEvent(new Event('resize')); } catch(e){} }, 1000);
    </script>

</body>
</html>
