<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mulia Trucking — Loading...</title>
    <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbz6ll2nnIKoe-5R50rs1thq2TTqqni-jM3ZaSIfj5RkqCICTLJ8Zt9gjVIlGDPuGjG48A/exec">
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1f4e79, #2f7fbf);
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            color: #fff;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .txt { font-size: 14px; opacity: .9; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <div class="txt">Mengalihkan ke aplikasi...</div>
    </div>
    <script>
        // Redirect segera — pakai replace() supaya tidak masuk history
        window.location.replace(
            'https://script.google.com/macros/s/AKfycbz6ll2nnIKoe-5R50rs1thq2TTqqni-jM3ZaSIfj5RkqCICTLJ8Zt9gjVIlGDPuGjG48A/exec'
        );
    </script>
</body>
</html>
